<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vidéothèque</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: url("https://www.transparenttextures.com/patterns/stardust.png"),
          linear-gradient(to bottom, #2e1065, #1e1b4b);
        background-size: cover;
        animation: stars 30s linear infinite;
      }

      @keyframes stars {
        0% {
          background-position: 0 0;
        }
        100% {
          background-position: 1000px 1000px;
        }
      }

      .flip-card {
        perspective: 1000px;
      }

      .flip-inner {
        transition: transform 0.8s;
        transform-style: preserve-3d;
        position: relative;
        width: 100%;
        height: 100%;
      }

      .flip-card:hover .flip-inner {
        transform: rotateY(180deg);
      }

      .flip-front,
      .flip-back {
        backface-visibility: hidden;
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        border-radius: 1rem;
      }

      .flip-back {
        transform: rotateY(180deg);
      }
    </style>
  </head>

  <body class="text-white font-sans">
    <header class="text-center py-10">
      <h1 class="text-4xl font-bold mb-2">🎥 Vidéothèque</h1>
      <p class="text-purple-300">
        Plonge dans un monde de films, séries et animés à regarder sans
        modération !<br />
        Trouve ton bonheur grâce à notre moteur magique de recherche...
      </p>
      <div class="max-w-xl mx-auto flex space-x-2 px-4 mt-6">
        <input
          id="search-input"
          type="text"
          placeholder="Rechercher un film... 🔎"
          class="w-full p-3 rounded-lg text-black"
        />
        <button class="bg-pink-600 hover:bg-pink-700 px-4 py-2 rounded-lg">
          Rechercher
        </button>
      </div>
    </header>

    <section class="flex justify-center flex-wrap gap-4 my-6 px-4">
      <button class="bg-indigo-700 hover:bg-indigo-800 px-4 py-2 rounded-lg">
        Tous
      </button>
      <button
        id="sort-asc"
        class="bg-indigo-700 hover:bg-indigo-800 px-4 py-2 rounded-lg"
      >
        Score croissant
      </button>
      <button
        id="sort-desc"
        class="bg-indigo-700 hover:bg-indigo-800 px-4 py-2 rounded-lg"
      >
        Score Décroissant
      </button>
    </section>

    <section class="px-6 mb-16">
      <h2 class="text-3xl font-semibold mb-6">👑 Top Films de la Semaine</h2>
      <div
        id="top-films"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
    </section>

    <section class="px-6 pb-16">
      <h2 class="text-3xl font-semibold mb-6">🎬 Tous les Films</h2>
      <div
        id="film-list"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
    </section>

    <script src="./script.js"></script>
  </body>
</html>
